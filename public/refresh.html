<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Refreshing iBuildPro...</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { text-align: center; padding: 2rem; }
    .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #333; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 1rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Refreshing iBuildPro...</h2>
    <p>Clearing cached data. You'll be redirected automatically.</p>
  </div>
  <script>
    (async function() {
      // 1. Clear IndexedDB (React Query cache)
      try {
        var dbs = await indexedDB.databases();
        for (var db of dbs) { if (db.name) indexedDB.deleteDatabase(db.name); }
      } catch(e) {
        // Firefox fallback - delete known DB
        try { indexedDB.deleteDatabase('keyval-store'); } catch(e2) {}
      }

      // 2. Clear all Cache API caches
      if ('caches' in window) {
        var names = await caches.keys();
        for (var n of names) { await caches.delete(n); }
      }

      // 3. Unregister service workers
      if ('serviceWorker' in navigator) {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var r of regs) { await r.unregister(); }
      }

      // 4. Clear storage
      localStorage.removeItem('app_version_cache');
      sessionStorage.clear();

      // 5. Redirect to home with cache-bust param
      window.location.replace('/?_cb=' + Date.now());
    })();
  </script>
</body>
</html>
